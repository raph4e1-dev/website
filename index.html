<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photography</title>
<style>
  :root {
    --paper: #ffffff;
    --ink: #1a1a1a;
    --red: #d8352a;                 /* placeholder colour: replace with images later */
    --s: min(14vh, 9.5vw);          /* base size of one square */
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --load: #ececec;
    --ease: cubic-bezier(.65, 0, .35, 1);   /* in / out curve of the icons' trip: slow, fast, slow */
    --dur: .85s;                            /* how long the trip takes */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--font); }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Layer 1 (back): the circle of every photo. Layer 2: the 8 icons. Layer 3 (front): the Folders button. */
  .field {
    position: fixed; left: 0; top: 0; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; z-index: 1;
    transition: filter var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  /* The "world" holds every photo; drag moves it, wheel / pinch zooms it (script at the bottom) */
  .field { touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
  .field.drag, .field.drag .p { cursor: grabbing; }
  .world { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; will-change: transform; }
  .p { position: absolute; left: 0; top: 0; display: block; background: var(--load); cursor: pointer; }
  .p img { display: block; width: 100%; height: 100%; object-fit: cover; -webkit-user-drag: none; }
  .warn { position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); z-index: 6; font: 13px/1.4 var(--font); background: var(--ink); color: #fff; padding: 10px 14px; text-align: center; max-width: 90vw; }
  .p::after { content: ""; position: absolute; inset: 0; background: #000; opacity: var(--sh, 0); pointer-events: none; }   /* shade: edge of the ball is a bit darker */

  /* When the Folders are out, the circle of photos goes out of focus so the two layers are easy to tell apart */
  body.open .field { filter: blur(10px) saturate(1.15); transform: scale(1.04); pointer-events: none; }

  main {
    position: fixed; left: 0; top: 0; width: 100%; height: 100vh; height: 100dvh; z-index: 3;
    display: grid; place-items: center; pointer-events: none;
  }

  /* The row. Only the squares react to the pointer, so the gaps never trigger anything. */
  .row { display: flex; align-items: center; justify-content: center; gap: calc(var(--s) * .18); pointer-events: none; }

  .item {
    --k: 1;                                   /* size multiplier */
    --ty: 0px;                                /* vertical shift (used on phones to make room for text) */
    --lift: 0px;                              /* extra height of the title when a neighbour is in the way (set by the script) */
    position: relative; display: block; flex: none;
    width: var(--s); aspect-ratio: 1;
    pointer-events: auto; text-decoration: none;
    transform: translateY(var(--ty)) scale(var(--k));
    --d: calc((7 - var(--i, 0)) * 30ms);        /* delay: icons go back in one after the other */
    translate: 0 0; scale: 1; opacity: 1;
    transition: transform .35s cubic-bezier(.2, .7, .2, 1),
                translate var(--dur) var(--ease) var(--d), scale var(--dur) var(--ease) var(--d), opacity .5s ease var(--d);
  }
  /* Closed: every icon sits hidden inside the Folders button (--fx / --fy = the way back to it, set by the script) */
  .row:not(.open) .item { translate: var(--fx, 0px) var(--fy, 0px); scale: .15; opacity: 0; pointer-events: none; }
  .row.open .item { --d: calc(var(--i, 0) * 50ms); }   /* delay: icons come out one after the other */
  .box {
    position: absolute; inset: 0; background: var(--red);
    /* Soft shadow under the image: small and tight, so it stays inside the gap and never touches the square below */
    filter: drop-shadow(0 calc(var(--s) * .05) calc(var(--s) * .035) rgba(0, 0, 0, .28));
  }
  /* Gentle float, up and down. The title floats with its image, so it always comes out of the image's top edge */
  .box, .tag { animation: float 3.4s ease-in-out infinite alternate; }
  @keyframes float { from { translate: 0 0; } to { translate: 0 calc(var(--s) * -.045); } }
  /* Different start points so the squares don't all move together */
  .item:nth-child(2n) :is(.box, .tag) { animation-delay: -1.1s; }
  .item:nth-child(3n) :is(.box, .tag) { animation-delay: -2.3s; }
  .item:nth-child(5n) :is(.box, .tag) { animation-delay: -.6s; }
  .item:nth-child(7n) :is(.box, .tag) { animation-delay: -1.7s; }
  .box img { display: block; width: 100%; height: 100%; object-fit: contain; }   /* contain = whole cut-out visible, nothing cropped */
  .box:has(img) { background: none; }   /* images are transparent cut-outs: hide the red behind them */

  /* Text sits on top of the image. The tag clips it, so it slides up out of the image's visible top edge.
     --vt = where the visible part of the image starts (from the top), --vcx = its horizontal centre.
     The script at the bottom measures both for every image, so you can swap icons freely. */
  .tag {
    position: absolute; left: var(--vcx, 50%); bottom: calc(100% - var(--vt, 0%)); transform: translateX(-50%);
    padding-bottom: var(--lift, 0px);
    overflow: hidden; pointer-events: none; white-space: nowrap;
  }
  .label {
    display: block; padding: 0 .1em .55em; color: #000;
    font-weight: 700; font-size: clamp(14px, calc(var(--s) * .13), 26px); line-height: 1.2;
    transform: translateY(calc(100% + var(--lift, 0px)));
    transition: transform .35s cubic-bezier(.2, .7, .2, 1);
  }
  .item:focus-visible .label { transform: none; }

  /* Hover: the one you point at grows, the others shrink slightly */
  @media (hover: hover) {
    .row:has(.item:hover) .item,
    .row:has(.item:focus-visible) .item { --k: .95; }
    .row:has(.item:hover) .item:hover,
    .row:has(.item:focus-visible) .item:focus-visible { --k: 1.3; z-index: 1; }
    .item:hover .label { transform: none; }
  }
  .item:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

  /* Phone / portrait: 8 in one line would be too small to tap, so they sit in a 4 x 2 grid */
  @media (orientation: portrait) {
    :root { --s: 18vw; }
    .row { display: grid; grid-template-columns: repeat(4, var(--s)); gap: calc(var(--s) * .22); }
    /* Outer columns: titles line up with the square's edge instead of centring, so long titles never leave the screen */
    .item:nth-child(4n+1) .tag { left: 0; transform: none; }
    .item:nth-child(4n) .tag { left: auto; right: 0; transform: none; }
  }
  /* When a square in the bottom row is hovered, the top row moves up to make room for its text */
  @media (hover: hover) and (orientation: portrait) {
    .row:has(.item:nth-child(n+5):hover) .item:nth-child(-n+4),
    .row:has(.item:nth-child(n+5):focus-visible) .item:nth-child(-n+4) { --ty: calc(var(--s) * -.55); }
  }

  /* The Folders button */
  .folders {
    position: fixed; z-index: 5; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    font: 700 13px var(--font); color: var(--ink); white-space: nowrap; cursor: pointer;
    border: 1.5px solid var(--ink); border-radius: 999px; padding: 9px 18px; background: var(--paper);
    transition: background .2s, color .2s, opacity .35s;
  }
  .folders:hover, .folders:focus-visible { background: var(--ink); color: #fff; }
  .folders:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  /* ===== Collection view =====
     Same layout as page-1 ... page-8, but built inside this page (script section "COLLECTION VIEW").
     .fly = the photos while they travel from the ball; .cv = the collection itself once they have landed. */
  .fly { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  .fl { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; will-change: transform; }
  .fl img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .fl i { position: absolute; inset: 0; background: #000; opacity: 0; }
  .folders.away { opacity: 0; pointer-events: none; }

  .cv {
    --w: min(29vw, 54vh);               /* width of a photo (a little bigger than before: was min(26vw, 50vh)) */
    --gw: calc(var(--w) * 3.45);        /* width of a full screen of 6 photos */
    position: fixed; inset: 0; z-index: 4; display: none;
  }
  .cv.on { display: block; }
  .cv.fly { pointer-events: none; }
  .cv.fly .photo { visibility: hidden; }

  .cv-back {
    position: fixed; z-index: 7; top: max(18px, env(safe-area-inset-top)); left: 5vw;
    color: var(--ink); font-size: 14px; font-weight: 700; text-decoration: none; padding: 6px 0;
    opacity: 0; pointer-events: none; transition: opacity .35s ease;
  }
  .cv-back.show { opacity: 1; pointer-events: auto; }
  .cv-back:hover { text-decoration: underline; }
  .cv-back:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

  .cv .scroller {
    position: fixed; left: 0; top: 0; width: 100%; height: 100vh; height: 100dvh;
    overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; outline: none;
  }
  .cv .scroller::-webkit-scrollbar { height: 10px; }
  .cv .scroller::-webkit-scrollbar-track { background: var(--load); }
  .cv .scroller::-webkit-scrollbar-thumb { background: var(--ink); }
  @supports (-moz-appearance: none) { .cv .scroller { scrollbar-width: thin; scrollbar-color: var(--ink) var(--load); } }
  .cv .track { display: flex; width: max-content; height: 100%; padding: 0 max(0px, calc((100vw - var(--gw)) / 2)); }
  .cv .group { position: relative; flex: none; width: calc(var(--w) * 1.15 * var(--cols, 3)); height: 100%; }     /* a screen is as wide as its columns of 2 photos */
  .cv .photo {
    --dx: var(--dxl); --dy: var(--dyl); --sy: 1;
    position: absolute; width: calc(var(--w) * var(--k, 1)); aspect-ratio: var(--a);
    left: calc(50% + var(--dx) * var(--w)); top: calc(50% + var(--dy) * var(--sy) * var(--w) * .6667);
    transform: translate(-50%, -50%) rotate(var(--r));
    margin: 0; background: var(--load); overflow: hidden;
  }
  .cv .photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .cv .group.flip .photo { --sy: -1; }
  @media (orientation: portrait) {
    .cv { --w: min(45vw, 37vh); --gw: calc(var(--w) * 2.2); }     /* two columns just fit the width of a phone */
    .cv .group { width: var(--gw); }
    .cv .photo { --dx: var(--dxp); --dy: var(--dyp); }
    .cv .group.flip .photo { --sy: 1; }
  }

  /* Pointing at a photo of a collection: it lifts, straightens a little and gets a shadow */
  .cv .photo:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  @media (hover: hover) {
    .cv .photo { cursor: zoom-in; transition: transform .4s cubic-bezier(.2, .7, .2, 1), box-shadow .4s cubic-bezier(.2, .7, .2, 1); }
    .cv:not(.fly):not(.nh) .photo:hover {
      transform: translate(-50%, calc(-50% - 8px)) rotate(calc(var(--r) * .3)) scale(1.05); z-index: 2;
      box-shadow: 0 24px 48px rgba(0, 0, 0, .26), 0 8px 16px rgba(0, 0, 0, .16);
    }
  }
  .cv.nh .photo { transition: none !important; transform: translate(-50%, -50%) rotate(var(--r)) !important; box-shadow: none !important; }

  /* Click on a photo: it opens almost full screen. The x (or Escape, or a click outside the photo) closes it */
  .lb { position: fixed; inset: 0; z-index: 8; display: none; background: rgba(255, 255, 255, .96); opacity: 0; transition: opacity .35s ease; cursor: zoom-out; }
  .lb.on { display: block; }
  .lb.show { opacity: 1; }
  .lb img { position: absolute; left: 50%; top: 50%; display: block; transform: translate(-50%, -50%); box-shadow: 0 24px 60px rgba(0, 0, 0, .25); }
  .lb-x {
    position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(10px, 3vw); width: 48px; height: 48px;
    display: grid; place-items: center; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink);
  }
  .lb-x svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; }
  .lb-x:focus-visible { outline: 2px solid var(--ink); outline-offset: -4px; }


  /* ===== Collage: cut-out pictures around the ball, behind it. Each one sits at a different depth (see script "COLLAGE PARALLAX").
     Every file is a crop of a 3840 x 2160 canvas; --u = size of one canvas pixel on screen, so on a 16:9 screen they sit exactly as in main_page.png.
     Left / right / top / bottom: each picture stays glued to its nearest edge of the screen on other shapes of screen. */
  :root { --u: max(calc(100vw / 3840), calc(100vh / 2160)); }
  @supports (height: 100dvh) { :root { --u: max(calc(100vw / 3840), calc(100dvh / 2160)); } }
  .collage { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; transition: filter var(--dur) var(--ease), transform var(--dur) var(--ease); }
  .cl { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; translate: 0 0;
        transition: translate .9s cubic-bezier(.2, .7, .2, 1) calc(var(--i, 0) * 45ms); }      /* coming back (after a collection) */
  .cl img { position: absolute; display: block; max-width: none; opacity: 0; transition: opacity .8s ease; -webkit-user-drag: none; user-select: none; }
  .cl img.in { opacity: 1; }
  .collage.gone .cl { translate: 0 170vh; transition: translate .85s cubic-bezier(.55, 0, .9, .55) calc(var(--i, 0) * 45ms); }   /* a collection opens: they drop off the bottom like the photos */
  .collage.nt .cl { transition: none; }
  /* Where each picture sits. Landscape: as in main_page.png (3840 x 2160). Portrait / phone: as in phone.png (2160 x 3840), kept in the middle and the bottom of the screen, and without the camera. */
  .cl[data-n="palmtree"] img { right:calc(var(--u) * 0);left:auto; top:calc(var(--u) * 0);bottom:auto; width: calc(var(--u) * 607); height: calc(var(--u) * 2160); }
  .cl[data-n="hlm"] img { left:calc(var(--u) * 0);right:auto; bottom:calc(var(--u) * 0);top:auto; width: calc(var(--u) * 806); height: calc(var(--u) * 1862); }
  .cl[data-n="guy"] img { right:calc(var(--u) * 370);left:auto; bottom:calc(var(--u) * 0);top:auto; width: calc(var(--u) * 595); height: calc(var(--u) * 1218); }
  .cl[data-n="man"] img { right:calc(var(--u) * 0);left:auto; bottom:calc(var(--u) * 0);top:auto; width: calc(var(--u) * 1829); height: calc(var(--u) * 919); }
  .cl[data-n="sheep"] img { left:calc(var(--u) * 0);right:auto; bottom:calc(var(--u) * 0);top:auto; width: calc(var(--u) * 829); height: calc(var(--u) * 647); }
  .cl[data-n="camera"] img { left:calc(var(--u) * 901);right:auto; bottom:calc(var(--u) * 0);top:auto; width: calc(var(--u) * 350); height: calc(var(--u) * 583); }
  .cl[data-n="duck"] img { left:calc(var(--u) * 1313);right:auto; bottom:calc(var(--u) * 0);top:auto; width: calc(var(--u) * 204); height: calc(var(--u) * 172); }
  .cl[data-n="toro"] img { right:calc(var(--u) * 1160);left:auto; bottom:calc(var(--u) * 0);top:auto; width: calc(var(--u) * 271); height: calc(var(--u) * 308); }
  @media (orientation: portrait) {
    :root { --u: max(calc(100vw / 2160), calc(100vh / 3840)); }
    @supports (height: 100dvh) { :root { --u: max(calc(100vw / 2160), calc(100dvh / 3840)); } }
    .cl[data-n="palmtree"] img { left: calc(50% + var(--u) * 552); right: auto; bottom: calc(var(--u) * 224); top: auto; width: calc(var(--u) * 607); height: calc(var(--u) * 2160); }
    .cl[data-n="hlm"] img { left: calc(50% + var(--u) * -1535); right: auto; bottom: calc(var(--u) * -110.52); top: auto; width: calc(var(--u) * 1176.76); height: calc(var(--u) * 2718.52); }
    .cl[data-n="guy"] img { left: calc(50% + var(--u) * 202); right: auto; bottom: calc(var(--u) * 18); top: auto; width: calc(var(--u) * 595); height: calc(var(--u) * 1218); }
    .cl[data-n="man"] img { left: calc(50% + var(--u) * -228); right: auto; bottom: calc(var(--u) * 81.13); top: auto; width: calc(var(--u) * 1335.17); height: calc(var(--u) * 670.87); }
    .cl[data-n="sheep"] img { left: calc(50% + var(--u) * -1004); right: auto; bottom: calc(var(--u) * 136.65); top: auto; width: calc(var(--u) * 870.45); height: calc(var(--u) * 679.35); }
    .cl[data-n="duck"] img { left: calc(50% + var(--u) * 198); right: auto; bottom: calc(var(--u) * 64.76); top: auto; width: calc(var(--u) * 136.68); height: calc(var(--u) * 115.24); }
    .cl[data-n="toro"] img { left: calc(50% + var(--u) * -134); right: auto; bottom: calc(var(--u) * 68); top: auto; width: calc(var(--u) * 271); height: calc(var(--u) * 308); }
    .cl[data-n="camera"] { display: none; }
  }

  /* White blurred cloud under the ball's photos (drawn from their positions, see script "VEIL"). It is white, so it only shows where it lies over the collage. */
  .veil { position: fixed; z-index: 0; pointer-events: none; filter: blur(var(--vb, 16px)); opacity: .92; transition: opacity .6s ease, transform var(--dur) var(--ease); }
  .veil.gone { opacity: 0; }
  .veil.nt { transition: none; }
  body.open .veil { transform: scale(1.04); }
  body.open .collage { filter: blur(10px) saturate(1.15); transform: scale(1.04); }          /* same out-of-focus as the ball when the Folders are out */

  @media (prefers-reduced-motion: reduce) { .item, .label, .field, .p, .lb, .cv .photo, .cl, .cl img, .veil { transition: none; } .box, .tag { animation: none; } }
</style>
</head>
<body>
<h1 class="sr-only">Photography</h1>
<div class="collage" id="collage" aria-hidden="true">
  <div class="cl" data-n="palmtree" style="--i:0" data-a="50" data-e="0.06" data-f="0.1"><img src="collage/palmtree.webp" alt="" decoding="async"></div>
  <div class="cl" data-n="hlm" style="--i:1" data-a="70" data-e="0.1" data-f="0.11"><img src="collage/hlm.webp" alt="" decoding="async"></div>
  <div class="cl" data-n="guy" style="--i:2" data-a="100" data-e="0.14" data-f="0.12"><img src="collage/guy.webp" alt="" decoding="async"></div>
  <div class="cl" data-n="man" style="--i:3" data-a="120" data-e="0.15" data-f="0.12"><img src="collage/man.webp" alt="" decoding="async"></div>
  <div class="cl" data-n="sheep" style="--i:4" data-a="100" data-e="0.13" data-f="0.13"><img src="collage/sheep.webp" alt="" decoding="async"></div>
  <div class="cl" data-n="camera" style="--i:5" data-a="150" data-e="0.2" data-f="0.14"><img src="collage/camera.webp" alt="" decoding="async"></div>
  <div class="cl" data-n="duck" style="--i:6" data-a="170" data-e="0.25" data-f="0.15"><img src="collage/duck.webp" alt="" decoding="async"></div>
  <div class="cl" data-n="toro" style="--i:7" data-a="190" data-e="0.28" data-f="0.16"><img src="collage/toro.webp" alt="" decoding="async"></div>
</div>
<canvas class="veil" id="veil" aria-hidden="true"></canvas>
<div class="field" id="field" aria-hidden="true"></div>
<main id="icons">
  <!--
    HOW TO EDIT
    - Each square is one <a>. Change href to its page and the text in .label to its title.
      To use a photo instead of red, put <img src="photos/cover.jpg" alt=""> inside .box.
    - Colour of the squares: --red above. Base size: --s above.
    - Hover sizes: --k: 1.3 (hovered) and --k: .95 (the others) in the hover rules.
    - Titles: positioned automatically from each image's visible (non-transparent) area. If your browser blocks that
      (it can when you open the file by double-click), add data-visible="left top right bottom" in % of the square to the <a>,
      e.g. data-visible="12 20 88 95". Without either, the title uses the whole square.
    - Shadow: the drop-shadow line in .box. Float: 3.4s = speed, -.045 = height of the up/down movement.
  -->
  <nav class="row" id="row" aria-label="Folders" inert>
    <a class="item" style="--i:0" href="page-1.html" aria-label="Oh Manchester"><span class="box"><img src="photos/manchester.webp" alt=""></span><span class="tag"><span class="label">Oh Manchester</span></span></a>
    <a class="item" style="--i:1" href="page-2.html" aria-label="Angoûmerde"><span class="box"><img src="photos/angouleme.webp" alt=""></span><span class="tag"><span class="label">Angoûmerde</span></span></a>
    <a class="item" style="--i:2" href="page-3.html" aria-label="Paris Life"><span class="box"></span><span class="tag"><span class="label">Paris Life</span></span></a>
    <a class="item" style="--i:3" href="page-4.html" aria-label="Back to the Old House"><span class="box"><img src="photos/backtotheoldhouse.webp" alt=""></span><span class="tag"><span class="label">Back to the Old House</span></span></a>
    <a class="item" style="--i:4" href="page-5.html" aria-label="Diagonal du vide"><span class="box"><img src="photos/clermont.webp" alt=""></span><span class="tag"><span class="label">Diagonal du vide</span></span></a>
    <a class="item" style="--i:5" href="page-6.html" aria-label="Amsterdam"><span class="box"><img src="photos/amsterdam.webp" alt=""></span><span class="tag"><span class="label">Amsterdam</span></span></a>
    <a class="item" style="--i:6" href="page-7.html" aria-label="Cannes 26"><span class="box"><img src="photos/cannes.webp" alt=""></span><span class="tag"><span class="label">Cannes 26</span></span></a>
    <a class="item" style="--i:7" href="page-8.html" aria-label="Tenerife - Madrid"><span class="box"><img src="photos/tenerife.webp" alt=""></span><span class="tag"><span class="label">Tenerife - Madrid</span></span></a>
  </nav>
</main>
<button class="folders" id="folders" type="button" aria-expanded="false" aria-controls="row">Folders</button>
<div class="fly" id="fly" aria-hidden="true"></div>
<!-- The collection view (filled by the script when a Folders icon is clicked) -->
<div class="cv" id="cv"><div class="scroller" id="cvScroller" role="region" tabindex="0"></div></div>
<a class="cv-back" id="cvBack" href="#">Back</a>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo"><img alt=""><button class="lb-x" id="lbX" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>

<script>
  // ---- Titles follow the visible part of each image (transparent margins are ignored) ----
  // ===== WHERE THE FILES ARE (paths are relative to this html file, so it must sit next to these folders) =====
  const PHOTO_FOLDER = n => 'web-photos/collection-' + n;   // photos of collection n (1 to 8): web-photos/collection-1/, web-photos/collection-2/, ...
  const ICON_FOLDER = 'photos';                             // folder of the icons shown by the Folders button
  const ICONS = ['manchester', 'angouleme', null, 'backtotheoldhouse', 'clermont', 'amsterdam', 'cannes', 'tenerife'];   // icon file names (.webp), in order; null = no icon yet (red square)
  const PAGE = n => 'page-' + n + '.html';                  // page that collection n opens
  // ==========================================================================================================

  const items = [...document.querySelectorAll('.item')];
  items.forEach((it, i) => {                                // icons + links come from the block above
    it.href = PAGE(i + 1);
    const box = it.querySelector('.box'); let img = box.querySelector('img');
    if (!ICONS[i]) { if (img) img.remove(); return; }
    if (!img) { img = new Image(); img.alt = ''; box.appendChild(img); }
    img.src = ICON_FOLDER + '/' + ICONS[i] + '.webp';
  });
  const FULL = { l: 0, t: 0, r: 1, b: 1 };
  const rects = new Map();                      // visible area of each item, as fractions of its square

  function applyRect(item, r) {
    rects.set(item, r);
    item.style.setProperty('--vt', (r.t * 100) + '%');
    item.style.setProperty('--vcx', ((r.l + r.r) / 2 * 100) + '%');
  }

  function measure(img) {                       // reads the image's alpha channel
    try {
      const nw = img.naturalWidth, nh = img.naturalHeight;
      if (!nw || !nh) return FULL;
      const k = Math.min(1, 200 / Math.max(nw, nh));
      const w = Math.max(1, Math.round(nw * k)), h = Math.max(1, Math.round(nh * k));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, w, h);
      const d = ctx.getImageData(0, 0, w, h).data;
      let x0 = w, y0 = h, x1 = -1, y1 = -1;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (d[(y * w + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      }
      if (x1 < 0) return FULL;
      const a = nw / nh, dw = a >= 1 ? 1 : a, dh = a >= 1 ? 1 / a : 1;   // the image is drawn with object-fit: contain
      const ox = (1 - dw) / 2, oy = (1 - dh) / 2;
      return { l: ox + x0 / w * dw, r: ox + (x1 + 1) / w * dw, t: oy + y0 / h * dh, b: oy + (y1 + 1) / h * dh };
    } catch (e) { return FULL; }                // blocked by the browser
  }

  // A title goes higher when a taller neighbour in the same line would be in its way.
  const HOVER = 1.3, OTHERS = .95, GAP = 10;    // sizes while hovering (same as --k in the CSS) and the clear space in px
  function updateLifts() {
    items.forEach(it => it.style.setProperty('--lift', '0px'));
    items.forEach(it => {
      const r = rects.get(it); if (!r) return;
      const W = it.offsetWidth, H = it.offsetHeight;
      const cx = it.offsetLeft + W / 2, cy = it.offsetTop + H / 2;
      const cs = getComputedStyle(it.querySelector('.tag')), label = it.querySelector('.label');
      const tw = label.offsetWidth, th = label.offsetHeight;
      let x0;                                   // left edge of the title before scaling
      if (cs.left === 'auto') x0 = it.offsetLeft + W - tw;
      else if (cs.transform === 'none') x0 = it.offsetLeft + parseFloat(cs.left);
      else x0 = it.offsetLeft + parseFloat(cs.left) - tw / 2;
      const lx0 = cx + (x0 - cx) * HOVER, lx1 = cx + (x0 + tw - cx) * HOVER;   // horizontal span of the title when hovered
      const anchor = cy + (it.offsetTop + r.t * H - cy) * HOVER;                // where the title starts (visible top)
      let need = 0;
      items.forEach(o => {
        if (o === it || Math.abs(o.offsetTop - it.offsetTop) > H / 2) return;   // only neighbours in the same line
        const q = rects.get(o), ow = o.offsetWidth, oh = o.offsetHeight;
        const ocx = o.offsetLeft + ow / 2, ocy = o.offsetTop + oh / 2;
        const l = ocx + (o.offsetLeft + q.l * ow - ocx) * OTHERS, rr = ocx + (o.offsetLeft + q.r * ow - ocx) * OTHERS;
        const t = ocy + (o.offsetTop + q.t * oh - ocy) * OTHERS, b = ocy + (o.offsetTop + q.b * oh - ocy) * OTHERS;
        if (rr < lx0 - 4 || l > lx1 + 4) return;                                // not beside the title
        if (t >= anchor || b < anchor - th * HOVER) return;                     // not in its way
        need = Math.max(need, anchor - t + GAP);
      });
      it.style.setProperty('--lift', (need / HOVER) + 'px');
    });
  }

  const jobs = items.map(it => {
    const img = it.querySelector('img');
    const m = (it.dataset.visible || '').trim().split(/[\s,]+/).map(Number);
    if (m.length === 4 && m.every(Number.isFinite)) { applyRect(it, { l: m[0] / 100, t: m[1] / 100, r: m[2] / 100, b: m[3] / 100 }); return null; }
    applyRect(it, FULL);
    if (!img) return null;
    const ready = img.complete ? Promise.resolve() : new Promise(res => { img.addEventListener('load', res, { once: true }); img.addEventListener('error', res, { once: true }); });
    return ready.then(() => applyRect(it, measure(img)));
  });
  updateLifts();
  Promise.all(jobs).then(updateLifts);
  window.addEventListener('resize', updateLifts);
  if (document.fonts) document.fonts.ready.then(updateLifts);

  // ---- An icon whose image is missing shows as a red square ----
  items.forEach(it => {
    const img = it.querySelector('img');
    if (!img) return;
    if (img.complete && !img.naturalWidth) img.remove(); else img.addEventListener('error', () => img.remove());
  });

  // ---- Folders button: the 8 icons come out of it and go back in ----
  const btn = document.getElementById('folders'), row = document.getElementById('row');
  let isOpen = false;

  function updateFly() {                        // how far each icon is from the button (its hiding place)
    const r = btn.getBoundingClientRect(), bx = r.left + r.width / 2, by = r.top + r.height / 2;
    items.forEach(it => {
      it.style.setProperty('--fx', (bx - (it.offsetLeft + it.offsetWidth / 2)) + 'px');
      it.style.setProperty('--fy', (by - (it.offsetTop + it.offsetHeight / 2)) + 'px');
    });
  }
  function setOpen(open) {
    isOpen = open;
    if (open) updateFly();
    if (open) sel = -1;                         // the Folders come out: any opened photo goes back
    row.classList.toggle('open', open);
    document.body.classList.toggle('open', open);
    row.inert = !open;
    btn.setAttribute('aria-expanded', open);
    btn.textContent = open ? 'Close' : 'Folders';
  }
  btn.addEventListener('click', () => setOpen(!isOpen));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && isOpen) setOpen(false); });
  document.addEventListener('click', e => { if (isOpen && !e.target.closest('.item, .folders')) setOpen(false); });
  updateFly();
  addEventListener('resize', updateFly);

  // ---- The circle of every photo (the background) ----
  // [collection, photo number, file name, width, height], in folder order: the first one ends up in the middle.
  const DATA = [[1,1,"000085700001",2560,1697],[1,2,"000085700002",2560,1697],[1,3,"000085700003",2560,1697],[1,4,"000085700005",2560,1697],[1,5,"000085700006",2560,1697],[1,6,"000085700007",2560,1697],[1,7,"000085700008",2560,1697],[1,8,"000085700010",2560,1697],[1,9,"000085700011",2560,1697],[1,10,"000085700012",2560,1697],[1,11,"000085700013",2560,1697],[1,12,"000085700015",2560,1697],[1,13,"000085700017",2560,1697],[1,14,"000085700018",2560,1697],[1,15,"000085700019",2560,1697],[1,16,"000085700020",2560,1697],[1,17,"000085700024",2560,1697],[1,18,"000138760017",2560,1697],[1,19,"000138760019",2560,1697],[1,20,"000138760020",2560,1697],[1,21,"000138760021",2560,1697],[1,22,"000138760022",2560,1697],[1,23,"000138760023",2560,1697],[1,24,"000138760024",2560,1697],[1,25,"000138760026",2560,1697],[1,26,"000138760027",2560,1697],[1,27,"000138760028",2560,1697],[1,28,"000138760029",2560,1697],[1,29,"000138760031",2560,1697],[1,30,"000138760033",2560,1697],[1,31,"000138760035",2560,1697],[1,32,"000138760036",2560,1697],[1,33,"000165180008-8",2560,1697],[1,34,"000165180009-9",2560,1697],[1,35,"000165180010-10",2560,1697],[1,36,"000165180011-11",2560,1697],[1,37,"000165180012-12",2560,1697],[1,38,"000165180013-13",2560,1697],[1,39,"000165180014-14",2560,1697],[1,40,"000165180015-15",2560,1697],[1,41,"000165180016-16",2560,1697],[1,42,"000165180017-17",2560,1697],[1,43,"000165180018-18",2560,1697],[1,44,"000165180019-19",2560,1697],[1,45,"000165180020-20",2560,1697],[1,46,"000165180021-21",2560,1697],[1,47,"000165180022-22",2560,1697],[1,48,"000165180023-23",2560,1697],[1,49,"000165180024-24",2560,1697],[1,50,"000165180025-25",2560,1697],[1,51,"000165180026-26",2560,1697],[1,52,"000165180027-27",2560,1697],[1,53,"000165180028-28",2560,1697],[1,54,"000165180029-29",2560,1697],[1,55,"000165180030-30",2560,1697],[1,56,"000165180031-31",2560,1697],[2,1,"000138760004",2560,1697],[2,2,"000138760006",2560,1697],[2,3,"000138760007",2560,1697],[2,4,"000138760008",2560,1697],[2,5,"0 -3a",2560,1697],[4,27,"000165180032-32",2560,1697],[4,28,"000165180033-33",2560,1697],[4,29,"000165180034-34",2560,1697],[5,1,"000156780004-4a",2560,1697],[5,2,"000156780005-5a",2560,1697],[5,3,"000156780007-7a",2560,1697],[5,4,"000156780009-9a",2560,1697],[5,5,"000184970020-20",2560,1697],[5,6,"000184970023-23",2560,1697],[5,7,"000184970024-24",2560,1697],[5,8,"000184970025-25",2560,1697],[5,9,"000184970026-26",2560,1697],[5,10,"000184970027-27",2560,1697],[5,11,"000184970028-28",2560,1697],[5,12,"000184970029-29",2560,1697],[5,13,"000184970030-30",2560,1697],[5,14,"000184970031-31",2560,1697],[6,1,"000184970001-1",2560,1697],[6,2,"000184970002-2",2560,1697],[6,3,"000184970003-3",2560,1697],[6,4,"000184970004-4",2560,1697],[6,5,"000184970005-5",2560,1697],[6,6,"000184970006-6",2560,1697],[6,7,"000196910033",2560,1697],[6,8,"000196910034",2560,1697],[6,9,"000196910035",2560,1697],[6,10,"000196910036",2560,1697],[7,1,"000196910013",2560,1697],[7,2,"000196910014",2560,1697],[7,3,"000196910015",2560,1697],[7,4,"000196910016",2560,1697],[7,5,"000196910018",2560,1697],[7,6,"000196910019",2560,1697],[7,7,"000196910020",2560,1697],[7,8,"000196910025",2560,1697],[7,9,"000196910028",2560,1697],[7,10,"000196910029",2560,1697],[8,1,"000156780019-19a",2560,1697],[8,2,"000156780020-20a",2560,1697],[8,3,"000156780021-21a",2560,1697],[8,4,"000156780022-22a",2560,1697],[8,5,"000156780023-23a",2560,1697],[8,6,"000156780024-24a",2560,1697],[8,7,"000165180035-35",2560,1697],[8,8,"000165180036-36",2560,1697],[8,9,"000196910001",2560,1697],[8,10,"000196910002",2560,1697],[8,11,"000196910003",2560,1697],[8,12,"000196910004",2560,1697],[8,13,"000196910005",2560,1697],[8,14,"000196910006",2560,1697]];
  const field = document.getElementById('field');
  const world = document.createElement('div'); world.className = 'world'; field.appendChild(world);

  // Photos sit on a staggered grid (like bricks), aligned and untilted. The grid cells are sorted by their distance
  // from the centre and the first N are used: photo 1 in the middle, then outwards in order, filling a round shape.
  function layout(asp, W, H) {
    const n = asp.length, amin = Math.min(...asp);
    const m = Math.max(16, Math.min(W, H) * .04);                                    // margin around the circle
    const e = 1;                                                                     // a true circle everywhere, phones included
    const K = Math.ceil(Math.sqrt(n) * 1.6) + 4;

    function place(w) {
      const h = w / amin, g = Math.max(2, w * .12), cw = w + g, ch = h + g, cells = [];
      for (let j = -K; j <= K; j++) for (let i = -K; i <= K; i++) {
        const x = (i + (Math.abs(j) % 2 ? .5 : 0)) * cw, y = j * ch;
        cells.push({ x, y, d: Math.hypot(x, y / e) });
      }
      cells.sort((a, b) => a.d - b.d);
      const used = cells.slice(0, n);
      let X = 0, Y = 0;
      used.forEach(c => { X = Math.max(X, Math.abs(c.x)); Y = Math.max(Y, Math.abs(c.y)); });
      return { used, fits: X + w / 2 <= W / 2 - m && Y + h / 2 <= H / 2 - m };
    }

    let lo = 4, hi = Math.min(W, H) / 3;
    for (let k = 0; k < 24; k++) { const mid = (lo + hi) / 2; if (place(mid).fits) lo = mid; else hi = mid; }
    return { w: lo, pos: place(lo).used.map(c => [W / 2 + c.x, H / 2 + c.y]) };
  }

  const ASP = DATA.map(d => d[3] / d[4]);
  const mix = t => { const a = [216, 53, 42], b = [225, 225, 225]; return 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',') + ')'; };
  let failed = 0;                               // if no photo at all can be found, say why
  function showWarn() {
    const d = document.createElement('div'); d.className = 'warn';
    d.textContent = 'Photos not found. This file must sit in the same folder as "web-photos" and "photos" (see the paths at the top of the script).';
    document.body.appendChild(d);
  }
  const els = DATA.map(([n, k, name], i) => {
    const a = document.createElement('a'), img = document.createElement('img');
    const base = PHOTO_FOLDER(n) + '/' + name;
    a.className = 'p'; a.href = PAGE(n); a.tabIndex = -1;
    a.style.background = mix(Math.pow(i / (DATA.length - 1), .8));            // stand-in colour (red in the middle, grey outside) until the photo shows
    img.src = base + '-240.webp'; img.alt = ''; img.decoding = 'async';
    img.onerror = () => { img.onerror = () => { if (++failed === DATA.length) showWarn(); }; img.src = base + '-800.webp'; };     // tiny copy missing: try the 800 px one
    a.dataset.base = base;
    a.appendChild(img); world.appendChild(a);
    return a;
  });

  const RESERVE = 64;                           // room kept free at the top and bottom, so the button never covers a photo
  const LIFT = .04;                             // how much higher the ball sits than dead centre, as a share of the screen height (0 = centred)
  const TMAX = .7;                              // depth of the ball: how far round it the outer photos turn (radians). Bigger = rounder
  const SHADE = .25;                            // how much darker the edge of the ball is (0 = not at all)

  // The flat circle of photos is wrapped onto the face of a ball (see react() below). Here: the flat layout, done once per size.
  const FOCUS_FOLLOW = .12;                     // how fast the ball turns to face the photo you point at
  function render() {
    const W = field.clientWidth, H = field.clientHeight, cx = W / 2, cy = H / 2 - Math.round(H * LIFT);   // cy: the ball sits a bit above the middle
    const { w, pos } = layout(ASP, W, H - 2 * RESERVE);
    REL = pos.map(q => [q[0] - cx, q[1] - (H - 2 * RESERVE) / 2]);    // flat position of every photo, from the middle
    WW = w; CEN = [cx, cy];
    els.forEach((el, i) => { el.style.width = w + 'px'; el.style.height = (w / ASP[i]) + 'px'; });
    BALL = { cx, cy, r: Math.max(1, ...REL.map(q => Math.hypot(q[0], q[1]))) + w };
    clampView(); apply(); react(0, 0, 0); go();
  }

  // ---- Move and zoom: drag = move, wheel / pinch = zoom (smooth) ----
  const MAXZ = 12;
  let cur = { s: 1, x: 0, y: 0 }, tgt = { s: 1, x: 0, y: 0 }, raf = 0, dragging = false;
  let BALL = { cx: 0, cy: 0, r: 1 };
  function clampView() {                        // the view can go anywhere (more white), as long as a sliver of the ball stays on screen

    tgt.s = Math.min(MAXZ, Math.max(1, tgt.s));
    const rs = BALL.r * tgt.s, bx = tgt.x + BALL.cx * tgt.s, by = tgt.y + BALL.cy * tgt.s;
    tgt.x += Math.min(W + rs - m, Math.max(-rs + m, bx)) - bx;
    tgt.y += Math.min(H + rs - m, Math.max(-rs + m, by)) - by;
    tgt.y = Math.max(tgt.y, H * (1 - tgt.s));    // never show anything below the bottom edge of the start page (so the bottom of the collage never shows)
  }
  function apply() { world.style.transform = `translate(${cur.x}px, ${cur.y}px) scale(${cur.s})`; }
  function go() { if (!raf) raf = requestAnimationFrame(step); }
  // Every frame: (1) the ball turns to face the photo you point at (the middle when you point at nothing): that area gets bigger,
  // brighter and in front, the far side gets squeezed and darker. (2) Photos glide (no bounce) to where they should be:
  // they trail a little behind a drag, tilt slightly, swell / shrink with the zoom, and the one you point at grows while
  // its neighbours move away.
  const GAIN = [], CX = [], CY = [], ZI = [], MA = [], MB = [], MD = [], BX = [], BY = [], SH = [], DD = [], SX = [], SY = [], SS = [], CH = 4, POS = new Float32Array(DATA.length * CH);
  const RND = DATA.map((_, i) => .8 + .4 * (((i + 1) * 2654435761 >>> 0) % 1000) / 1000);     // each photo reacts a little differently
  const CALM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LAG = .3, SWELL = .8, TILT = .03, FOLLOW = .2;      // movement reaction: lower = calmer (FOLLOW = how fast photos catch up)
  const HOVER_SCALE = .3, PUSH = .4, REACH = 2.6;           // pointing: +30 % size; the others move away up to .4 photo widths, within 2.6 photo widths
  let REL = [], FOCUS = [0, 0], CEN = [0, 0], hov = -1, WW = 1, sel = -1;   // sel = the photo you clicked (it stays big), -1 = none
  const OPEN_SCALE = .5;                                    // clicked photo's width = this share of a photo in the collection view (.5 = half)
  const OPEN_MIN = 200;                                     // but never narrower than this (px), so it stays readable on phones
  function openWidth(i) {                                   // on-screen width of the clicked photo (same numbers as .cv --w)
    const portrait = innerHeight > innerWidth;
    const pw = portrait ? Math.min(innerWidth * .42, innerHeight * .34) : Math.min(innerWidth * .26, innerHeight * .5);

  }
  function setHover(i) { if (i !== hov) { hov = i; go(); } }
  function react(vx, vy, vz) {
    let busy = false;
    const lim = (v, m) => Math.max(-m, Math.min(m, v)), mv = CALM ? 0 : 1, F = CALM ? 1 : FOLLOW, n = els.length;

    f.className = 'fl'; f.style.width = el.style.width; f.style.height = el.style.height; f.style.background = el.style.background;
    im.alt = ''; im.src = src; f.append(im, sh); fly.appendChild(f);
    return { f, im, sh, sh0: +el.style.getPropertyValue('--sh') || 0 };
  }
  const offscreen = r => r.bottom < -50 || r.top > innerHeight + 50 || r.right < -50 || r.left > innerWidth + 50;

  async function openCollection(n, opt = {}) {
    if (cvBusy || cvOpen) return;
    cvBusy = true; curColl = n;
    const idx = collIdx(n), sel = new Set(idx), instant = opt.instant || CALM, H = innerHeight;
    if (!opt.noHistory) history.pushState({ coll: n }, '', '#collection-' + n);

    const blurred = isOpen, fs = fieldScale();
    const starts = idx.map(i => ballMatrix(els[i]));                  // read everything BEFORE anything moves
    const rects = els.map(el => el.getBoundingClientRect());
    const figs = buildCollection(n);
    cv.classList.add('on', 'fly');
    const ends = figs.map((fg, j) => photoMatrix(fg, ROT[n][j], parseFloat(els[idx[j]].style.width), parseFloat(els[idx[j]].style.height)));

    if (isOpen) setOpen(false);                                       // the icons go back into the button
    setHover(-1);
    btn.classList.add('away'); btn.inert = true;
    collage.classList.toggle('nt', !!instant); collage.classList.add('gone'); veil.classList.toggle('nt', !!instant); veil.classList.add('gone');                 // the collage drops away with the other photos

    if (instant) {
      idx.forEach(i => { els[i].style.visibility = 'hidden'; });
      field.style.visibility = 'hidden';
      cv.classList.remove('fly'); cvBack.classList.add('show'); cvOpen = true; cvBusy = false;
      cvScroller.focus({ preventScroll: true });
      return;
    }

    // 1) the photos of this collection fly out of the ball, left to right, and land in their place
    const anims = [];
    idx.forEach((i, j) => {
      const el = els[i], real = figs[j].firstChild, fl = makeFlyer(el, el.firstChild.currentSrc || el.firstChild.src);
      const delay = Math.min(1.2, Math.max(0, (ends[j].e + parseFloat(el.style.width) / 2) / innerWidth)) * FLY_STAGGER;
      const t = { duration: FLY_DUR, delay, easing: FLY_EASE, fill: 'both' };
      fl.f.style.transform = css(starts[j]);
      anims.push(fl.f.animate([{ transform: css(starts[j]) }, { transform: css(ends[j]) }], t));
      fl.sh.animate([{ opacity: fl.sh0 }, { opacity: 0 }], t);
      el.style.visibility = 'hidden';
      real.decode().then(() => { fl.im.src = real.currentSrc; }).catch(() => {});     // sharper file while travelling
    });
    if (blurred) fly.animate([{ filter: 'blur(10px) saturate(1.15)' }, { filter: 'blur(0px) saturate(1)' }],
      { duration: 850, easing: 'cubic-bezier(.65, 0, .35, 1)', fill: 'backwards' });    // same focus change as the ball behind

    // 2) every other photo drops off the bottom, the lowest ones first
    fallAnims = [];
    els.forEach((el, i) => {
      const r = rects[i]; if (sel.has(i) || offscreen(r)) return;
      const d = (H - r.top + 60 + H * .1) / (cur.s * fs), delay = Math.max(0, 1 - r.bottom / H) * FALL_STAGGER + Math.random() * 80;
      fallAnims.push(el.animate([{ translate: '0px 0px' }, { translate: '0px ' + d + 'px' }], { duration: FALL_DUR, delay, easing: FALL_EASE, fill: 'forwards' }));
    });

    await Promise.all(anims.map(a => a.finished.catch(() => {})));
    const seen = figs.filter(fg => { const r = fg.getBoundingClientRect(); return r.right > 0 && r.left < innerWidth; });
    await Promise.race([Promise.all(seen.map(fg => fg.firstChild.decode().catch(() => {}))), sleep(1500)]);   // landing photos must be ready
    cv.classList.remove('fly'); fly.innerHTML = '';                   // the real photos take over, exactly where the travelling ones are
    field.style.visibility = 'hidden';
    cvBack.classList.add('show'); cvOpen = true; cvBusy = false;
    cvScroller.focus({ preventScroll: true });
  }

  async function closeCollection() {
    if (cvBusy || !cvOpen) return;
    cvBusy = true; cvOpen = false;
    const n = curColl, idx = collIdx(n), sel = new Set(idx), H = innerHeight;
    const figs = [...cvScroller.querySelectorAll('.photo')];
    cvBack.classList.remove('show');
    collage.classList.remove('nt', 'gone'); veil.classList.remove('nt', 'gone');                              // the collage rises back
    closeLb(true); cv.classList.add('nh'); void cv.offsetWidth;          // no lifted photo while measuring

    fallAnims.forEach(a => a.cancel()); fallAnims = [];                // everything back at rest, then measure
    field.style.visibility = '';
    const starts = figs.map((fg, j) => photoMatrix(fg, ROT[n][j], parseFloat(els[idx[j]].style.width), parseFloat(els[idx[j]].style.height)));
    const ends = idx.map(i => ballMatrix(els[i])), rects = els.map(el => el.getBoundingClientRect());
    if (CALM) { finishClose(idx); return; }

    cv.classList.add('fly');
    const anims = [];
    idx.forEach((i, j) => {
      const el = els[i], fl = makeFlyer(el, figs[j].firstChild.currentSrc || figs[j].firstChild.src);
      const delay = (1 - Math.min(1.2, Math.max(0, starts[j].e / innerWidth)) / 1.2) * FLY_STAGGER * .7;
      const t = { duration: FLY_DUR * .9, delay, easing: FLY_EASE, fill: 'both' };
      fl.f.style.transform = css(starts[j]);
      anims.push(fl.f.animate([{ transform: css(starts[j]) }, { transform: css(ends[j]) }], t));
      fl.sh.animate([{ opacity: 0 }, { opacity: fl.sh0 }], t);
    });
    const rise = [];
    els.forEach((el, i) => {                                           // the others come back up from the bottom
      const r = rects[i]; if (sel.has(i) || offscreen(r)) return;
      const d = (H - r.top + 60 + H * .1) / (cur.s * fieldScale()), delay = Math.max(0, 1 - r.bottom / H) * FALL_STAGGER + Math.random() * 80;
      rise.push(el.animate([{ translate: '0px ' + d + 'px' }, { translate: '0px 0px' }], { duration: RISE_DUR, delay, easing: RISE_EASE, fill: 'both' }));
    });
    await Promise.all([...anims, ...rise].map(a => a.finished.catch(() => {})));
    rise.forEach(a => a.cancel());
    finishClose(idx);
  }
  function finishClose(idx) {
    idx.forEach(i => { els[i].style.visibility = ''; });
    fly.innerHTML = ''; cv.classList.remove('on', 'fly', 'nh'); cvScroller.innerHTML = '';
    btn.classList.remove('away'); btn.inert = false;
    curColl = 0; cvBusy = false; lastM = null; go();
  }


  // ---- A photo of a collection opens almost full screen ----
  const lb = document.getElementById('lb'), lbImg = lb.querySelector('img');
  let lbOpen = false, lbBusy = false, lbFig = null;
  const lbSize = a => { const w = Math.min(innerWidth * .94, innerHeight * .9 * a); return [w, w / a]; };     // fits in 94 % x 90 % of the screen
  function lbFrom(fig, w) {                      // puts the big photo exactly over the small one
    const r = fig.getBoundingClientRect(), cs = getComputedStyle(fig), m = new DOMMatrix(cs.transform);
    return `translate(-50%, -50%) translate(${r.left + r.width / 2 - innerWidth / 2}px, ${r.top + r.height / 2 - innerHeight / 2}px) rotate(${Math.atan2(m.b, m.a) * 180 / Math.PI}deg) scale(${Math.hypot(m.a, m.b) * parseFloat(cs.width) / w})`;
  }
  function openLb(fig) {
    if (lbOpen || lbBusy || !cvOpen) return;
    const d = DATA[collIdx(curColl)[+fig.dataset.j]], [w, h] = lbSize(d[3] / d[4]), im = fig.firstChild, set = im.srcset;
    lbOpen = true; lbFig = fig;
    lbImg.style.width = w + 'px'; lbImg.style.height = h + 'px'; lbImg.removeAttribute('srcset'); lbImg.src = im.currentSrc || im.src;
    const hi = new Image(); hi.sizes = '94vw'; hi.srcset = set; hi.onload = () => { if (lbFig === fig) { lbImg.sizes = '94vw'; lbImg.srcset = set; } };   // sharper file once loaded
    lb.classList.add('on'); void lb.offsetWidth; lb.classList.add('show');
    lbImg.animate([{ transform: lbFrom(fig, w) }, { transform: 'translate(-50%, -50%)' }], { duration: CALM ? 1 : 450, easing: 'cubic-bezier(.2, .7, .2, 1)' });
    fig.style.visibility = 'hidden';
    document.getElementById('lbX').focus({ preventScroll: true });
  }
  function closeLb(instant) {
    if (!lbOpen) return;
    const fig = lbFig, d = DATA[collIdx(curColl)[+fig.dataset.j]], [w] = lbSize(d[3] / d[4]);
    lbOpen = false; lb.classList.remove('show');
    const done = () => { fig.style.visibility = ''; lb.classList.remove('on'); lbImg.getAnimations().forEach(a => a.cancel()); lbBusy = false; if (!instant) fig.focus({ preventScroll: true }); };
    if (instant || CALM) { done(); return; }
    lbBusy = true;
    lbImg.animate([{ transform: 'translate(-50%, -50%)' }, { transform: lbFrom(fig, w) }], { duration: 380, easing: 'cubic-bezier(.5, 0, .2, 1)', fill: 'forwards' }).finished.then(done, done);
  }
  lb.addEventListener('click', () => closeLb());                                          // x, the photo or the background
  cvScroller.addEventListener('click', e => { const fg = e.target.closest('.photo'); if (fg) openLb(fg); });
  cvScroller.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.photo')) { e.preventDefault(); openLb(e.target); } });

  // ---- Triggers ----
  const plain = e => !(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button);   // new-tab clicks still open the page
  items.forEach((it, i) => it.addEventListener('click', e => { if (!plain(e)) return; e.preventDefault(); openCollection(i + 1); }));

  // ---- Click a photo of the ball: it grows right there and the photos around it make room. Click it again (or the background, or Escape) to put it back ----
  field.addEventListener('click', e => {
    if (!plain(e)) return;                                // ctrl / cmd / middle click still opens the collection page in a new tab
    const a = e.target.closest('.p');
    if (!a) { if (sel >= 0) { sel = -1; go(); } return; }
    e.preventDefault();
    const i = (hov >= 0 && hov !== sel) ? hov : els.indexOf(a);               // the pointed photo opens; the one that was open goes back (clicking the open one closes it)
    sel = i === sel ? -1 : i; go();
  });
  function goBack() {                                                  // Back button, Escape and the browser's back button all end up here
    if (history.state && history.state.coll && !history.state.deep) history.back();
    else { closeCollection(); history.replaceState(null, '', location.pathname + location.search); }
  }
  cvBack.addEventListener('click', e => { e.preventDefault(); goBack(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && lbOpen) closeLb(); else if (e.key === 'Escape' && cvOpen) goBack(); else if (e.key === 'Escape' && sel >= 0) { sel = -1; go(); } });
  addEventListener('popstate', e => {
    const s = e.state;
    if (cvOpen && !(s && s.coll)) closeCollection();
    else if (!cvOpen && !cvBusy && s && s.coll) openCollection(s.coll, { noHistory: true });
  });
  const deep = /^#collection-([1-8])$/.exec(location.hash);            // a link to #collection-3 opens it straight away
  if (deep) { history.replaceState({ coll: +deep[1], deep: true }, '', location.hash); openCollection(+deep[1], { instant: true, noHistory: true }); }
</script>
